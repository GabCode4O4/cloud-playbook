---
# =================================================================
# exam_mode.yml — Activation / désactivation du mode examen
# =================================================================
# Variables requises (extra vars AWX) :
#   exam_mode    : true  → proxy DÉMARRÉ avec whitelist (accès restreint)
#                  false → proxy ARRÊTÉ (accès internet total)
#   vmid_proxy   : identifiant de la VM proxy (ex: 42)
#                  → IP déduite : 172.16.205.<vmid_proxy>
#
# Variable optionnelle :
#   whitelist_entries : liste de regex (passée par le portail en mode examen)
#                       si absente, lecture depuis proxy_whitelist.txt
#   proxy_port        : port tinyproxy (défaut : 8888)
#
# Logique :
#   Mode EXAMEN → tinyproxy actif, seuls les sites de la whitelist sont joignables
#   Mode COURS  → tinyproxy arrêté, internet sans restriction
#   Le réseau interne 172.16.0.0/16 est toujours accessible (NO_PROXY)
# =================================================================

- name: Préparer l'inventaire dynamique
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Ajouter la VM proxy à l'inventaire
      ansible.builtin.add_host:
        name: "172.16.205.{{ vmid_proxy }}"
        groups: proxy_vm
        ansible_user: root
        ansible_password: etu
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o LogLevel=ERROR

    - name: Attendre que SSH soit disponible sur la VM proxy
      ansible.builtin.wait_for:
        host: "172.16.205.{{ vmid_proxy }}"
        port: 22
        timeout: 120
        state: started

# -----------------------------------------------------------------
# Play 2 : Gestion de tinyproxy sur la VM proxy
# -----------------------------------------------------------------
- name: "Gestion tinyproxy — mode examen : {{ exam_mode | bool }}"
  hosts: proxy_vm
  gather_facts: true
  become: false

  vars:
    proxy_port: 8888
    whitelist_src: "{{ playbook_dir }}/proxy_whitelist.txt"
    internal_subnet: "172.16.0.0/16"

  pre_tasks:
    - name: Bootstrap python3-apt
      ansible.builtin.raw: /usr/bin/apt-get install -y python3-apt
      changed_when: false
      when: exam_mode | bool

  tasks:

    # ── MODE COURS : arrêter tinyproxy ────────────────────────────
    - name: "[Mode Cours] Arrêter tinyproxy (accès internet total)"
      ansible.builtin.systemd:
        name: tinyproxy
        state: stopped
        enabled: false
      when: not exam_mode | bool
      ignore_errors: true

    - name: "[Mode Cours] Afficher le statut"
      ansible.builtin.debug:
        msg: >
          MODE COURS — tinyproxy arrêté sur 172.16.205.{{ vmid_proxy }}.
          Les étudiants ont accès à internet sans restriction.
      when: not exam_mode | bool

    # ── MODE EXAMEN : démarrer tinyproxy avec whitelist ───────────
    - name: "[Mode Examen] Charger la whitelist depuis le fichier (si non fournie via AWX)"
      ansible.builtin.set_fact:
        whitelist_entries: >-
          {{
            lookup('file', whitelist_src).splitlines()
            | reject('match', '^\\s*#')
            | reject('match', '^\\s*$')
            | list
          }}
      delegate_to: localhost
      when: exam_mode | bool and whitelist_entries is not defined

    - name: "[Mode Examen] Installer tinyproxy"
      ansible.builtin.apt:
        name: tinyproxy
        state: present
        update_cache: true
      when: exam_mode | bool

    - name: "[Mode Examen] Créer le répertoire de logs tinyproxy"
      ansible.builtin.file:
        path: /var/log/tinyproxy
        state: directory
        owner: tinyproxy
        group: tinyproxy
        mode: "0755"
      when: exam_mode | bool

    - name: "[Mode Examen] Déployer la configuration tinyproxy"
      ansible.builtin.template:
        src: templates/tinyproxy.conf.j2
        dest: /etc/tinyproxy/tinyproxy.conf
        owner: root
        group: root
        mode: "0644"
      notify: Redémarrer tinyproxy
      when: exam_mode | bool

    - name: "[Mode Examen] Déployer le fichier de filtres (whitelist)"
      ansible.builtin.template:
        src: templates/tinyproxy_filter.j2
        dest: /etc/tinyproxy/filter
        owner: tinyproxy
        group: tinyproxy
        mode: "0640"
      notify: Redémarrer tinyproxy
      when: exam_mode | bool

    - name: "[Mode Examen] Activer et démarrer tinyproxy"
      ansible.builtin.systemd:
        name: tinyproxy
        state: started
        enabled: true
        daemon_reload: true
      when: exam_mode | bool

    - name: "[Mode Examen] Vérifier que le port {{ proxy_port }} répond"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ proxy_port }}"
        state: started
        timeout: 30
      when: exam_mode | bool

    - name: "[Mode Examen] Afficher le statut"
      ansible.builtin.debug:
        msg: >
          MODE EXAMEN — tinyproxy actif sur 172.16.205.{{ vmid_proxy }}:{{ proxy_port }}.
          Whitelist : {{ whitelist_entries | length }} entrée(s) chargée(s).
          Réseau interne {{ internal_subnet }} toujours accessible.
      when: exam_mode | bool

  handlers:
    - name: Redémarrer tinyproxy
      ansible.builtin.systemd:
        name: tinyproxy
        state: restarted
