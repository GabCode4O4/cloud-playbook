---
- name: Préparation
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Reconstruire
      add_host:
        name: "172.16.205.{{ vmid_etudiant }}"
        groups: "new_vms"
        ansible_user: "etu"
        ansible_password: "etu"
        ansible_become_password: "etu"
        ansible_connection: "{{ 'winrm' if (choix_os in ['Win10', 'WinServer']) else 'ssh' }}"
        ansible_port: "{{ 5986 if (choix_os in ['Win10', 'WinServer']) else 22 }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_transport: ntlm
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR'

    - name: Attendre que WinRM soit prêt (Windows)
      ansible.builtin.wait_for:
        host: "172.16.205.{{ vmid_etudiant }}"
        port: 5986
        delay: 15
        timeout: 600
        state: started
      when: choix_os in ['Win10', 'WinServer']

    - name: Attendre que SSH soit prêt (Linux)
      ansible.builtin.wait_for:
        host: "172.16.205.{{ vmid_etudiant }}"
        port: 22
        delay: 5
        timeout: 300
        state: started
      when: choix_os in ['UbuntuServ', 'Debian']

- name: Installation des services
  hosts: new_vms
  gather_facts: false

  tasks:
    - name: "[Linux] Configuration Docker et Services"
      block:
        - name: Attendre la fin de Cloud-Init
          ansible.builtin.raw: cloud-init status --wait
          register: cloudinit_result
          changed_when: false
          failed_when: >-
            'status: done' not in cloudinit_result.stdout and
            'status: degraded' not in cloudinit_result.stdout

        - name: Installation Docker et dépendances
          ansible.builtin.apt:
            name:
              - docker.io
              - python3-pip
              - python3-docker
            state: present
            update_cache: true

        - name: Démarrer et activer Docker
          ansible.builtin.systemd:
            name: docker
            state: started
            enabled: true

        - name: Lancer Apache
          community.docker.docker_container:
            name: web_apache
            image: httpd:latest
            ports: ["80:80"]
            volumes:
              - "/var/www/html:/usr/local/apache2/htdocs"
            restart_policy: always
          when: "'Apache' in choix_services"

        - name: Lancer MariaDB
          community.docker.docker_container:
            name: bdd_mariadb
            image: mariadb:latest
            env:
              MARIADB_ROOT_PASSWORD: "etu"
            ports: ["3306:3306"]
            volumes:
              - "/home/etu/mysql_data:/var/lib/mysql"
            restart_policy: always
          when: "'MariaDB' in choix_services"

        - name: Vérifier qu'Apache répond
          ansible.builtin.uri:
            url: "http://localhost"
            status_code: 200
          when: "'Apache' in choix_services"

        - name: Vérifier que MariaDB répond
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 3306
            timeout: 30
          when: "'MariaDB' in choix_services"
      when: choix_os in ['UbuntuServ', 'Debian']
      become: true

    - name: "[Windows] Configuration Services Natifs"
      block:
        - name: Installer Apache via Chocolatey
          chocolatey.chocolatey.win_chocolatey:
            name: apache-httpd
            state: present
          when: "'Apache' in choix_services"

        - name: Localiser et reconfigurer httpd.conf (port 80)
          ansible.windows.win_powershell:
            script: |
              $candidates = @(
                  "C:\tools\apache24",
                  "C:\Apache24",
                  "C:\Program Files\Apache Group\Apache2",
                  "C:\Program Files\Apache Software Foundation\Apache2.4"
              )
              $apacheDir = $candidates | Where-Object { Test-Path "$_\conf\httpd.conf" } | Select-Object -First 1

              if (-not $apacheDir) {
                  $svc = Get-WmiObject Win32_Service |
                      Where-Object { $_.Name -like "Apache*" -or $_.DisplayName -like "Apache*" } |
                      Select-Object -First 1
                  if ($svc) {
                      $exe = ($svc.PathName -replace '"', '').Trim().Split(' ')[0]
                      $apacheDir = Split-Path (Split-Path $exe -Parent) -Parent
                  }
              }

              if (-not $apacheDir) { Write-Error "Répertoire Apache introuvable"; exit 1 }

              $confPath = "$apacheDir\conf\httpd.conf"
              Write-Host "Chemin détecté : $confPath"

              $content = [System.IO.File]::ReadAllText($confPath)
              # Remplace toutes les variantes : Listen 8080 / Listen 80 / Listen 0.0.0.0:8080
              $content = [regex]::Replace($content, '(?m)^Listen\s+[\d.:]+\d+', 'Listen 80')
              # Corrige ServerName si le port y est encodé
              $content = [regex]::Replace($content, '(?m)^(ServerName\s+\S+):\d+', '${1}:80')
              # Écriture UTF-8 sans BOM (Apache ne supporte pas le BOM)
              [System.IO.File]::WriteAllText($confPath, $content, [System.Text.UTF8Encoding]::new($false))
              Write-Host "httpd.conf mis à jour"
          when: "'Apache' in choix_services"

        - name: Redémarrer le service Apache
          ansible.windows.win_powershell:
            script: |
              $svc = Get-Service | Where-Object { $_.Name -like "Apache*" -or $_.DisplayName -like "Apache*" } | Select-Object -First 1
              if (-not $svc) { Write-Error "Service Apache introuvable"; exit 1 }
              Restart-Service -Name $svc.Name -Force
              $svc.WaitForStatus('Running', '00:00:30')
              Write-Host "Service $($svc.Name) redémarré, statut : $((Get-Service $svc.Name).Status)"
          when: "'Apache' in choix_services"

        - name: Ouvrir le firewall Windows pour Apache (port 80)
          ansible.windows.win_powershell:
            script: |
              # Détecter si port 80 est déjà pris par un autre processus (ex: IIS)
              $conflict = netstat -ano | Select-String '^\s+TCP\s+[\d.:]+:80\s+' | Select-Object -First 1
              if ($conflict) { Write-Host "AVERTISSEMENT port 80 déjà utilisé : $conflict" }

              $rule = Get-NetFirewallRule -DisplayName "Apache HTTP" -ErrorAction SilentlyContinue
              if ($rule) {
                  Set-NetFirewallRule -DisplayName "Apache HTTP" -LocalPort 80 -Protocol TCP -Action Allow
                  Write-Host "Règle firewall mise à jour"
              } else {
                  New-NetFirewallRule -DisplayName "Apache HTTP" `
                      -Direction Inbound -LocalPort 80 -Protocol TCP -Action Allow
                  Write-Host "Règle firewall créée"
              }
          when: "'Apache' in choix_services"

        - name: Installer MariaDB via Chocolatey
          chocolatey.chocolatey.win_chocolatey:
            name: mariadb
            state: present
          when: "'MariaDB' in choix_services"

        - name: Ouvrir le firewall pour MariaDB (port 3306)
          ansible.windows.win_powershell:
            script: |
              if (-not (Get-NetFirewallRule -DisplayName "MariaDB" -ErrorAction SilentlyContinue)) {
                  New-NetFirewallRule -DisplayName "MariaDB" `
                    -Direction Inbound `
                    -LocalPort 3306 `
                    -Protocol TCP `
                    -Action Allow
              }
          when: "'MariaDB' in choix_services"
      when: choix_os in ['Win10', 'WinServer']