---
- name: "Cloner la VM Template"
  community.proxmox.proxmox_kvm:
    api_host: "{{ pve_api_host }}"
    api_user: "root@pam"
    api_token_id: "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    node: "pve"
    vmid: "{{ template_id }}"
    clone: "VMtest"
    newid: "200{{ vmid_etudiant }}"
    validate_certs: false
    name: "VM-{{ vmid_etudiant }}-LINUX"
    full: false
    state: present
    ciuser: "etu"
    cipassword: "etu"
    net: '{"net0":"virtio,bridge=vmbr0,firewall=0"}'
    force: true
    timeout: 300

- name: "Injecter l'IP dans la config du clone"
  ansible.builtin.uri:
    url: "https://{{ pve_api_host }}:8006/api2/json/nodes/pve/qemu/200{{ vmid_etudiant }}/config"
    method: POST
    headers:
      Authorization: "PVEAPIToken=root@pam!{{ pve_api_token_id }}={{ pve_api_token_secret }}"
    body_format: form-urlencoded
    body:
      ipconfig0: "ip=192.168.1.1{{ vmid_etudiant }}/16,gw=192.168.1.1"
    validate_certs: false
    status_code: 200

- name: "[Linux] Regénérer le disque Cloud-Init"
  ansible.builtin.uri:
    url: "https://{{ pve_api_host }}:8006/api2/json/nodes/pve/qemu/200{{ vmid_etudiant }}/cloudinit"
    method: PUT
    headers:
      Authorization: "PVEAPIToken=root@pam!{{ pve_api_token_id }}={{ pve_api_token_secret }}"
    validate_certs: false
    status_code: 200

- name: "[Linux] Démarrer la nouvelle VM"
  community.proxmox.proxmox_kvm:
    api_host: "{{ pve_api_host }}"
    api_user: "root@pam"
    api_token_id: "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    node: "pve"
    vmid: "200{{ vmid_etudiant }}"
    validate_certs: false
    state: started
    timeout: 120

- name: "Attendre que le port SSH soit dispo"
  ansible.builtin.wait_for:
    host: "192.168.1.1{{ vmid_etudiant }}"
    port: 22
    delay: 15
    timeout: 300
    state: started

# La vraie attente (auth SSH + cloud-init terminé) est faite dans le second
# play de deploy.yml via wait_for_connection — pas besoin de pause statique ici.