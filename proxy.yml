---
- name: Cloner le proxy
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    template_id: 102

  tasks:
    - name: Installer proxmoxer
      pip:
        name: proxmoxer
        state: present

    - name: Cloner le proxy
      community.proxmox.proxmox_kvm:
        api_host: "{{ pve_api_host }}"
        api_user: "root@pam"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ pve_api_token_secret }}"
        node: "nimbus14"
        vmid: "{{ template_id }}"
        clone: "VMtest"
        newid: "10{{ vmid_proxy }}"
        validate_certs: false
        name: "VM-{{ vmid_proxy }}-LINUX"
        full: false
        state: present
        ciuser: "etu"
        cipassword: "etu"
        net: '{"net0":"virtio,bridge=vmbr0,firewall=0"}'
        force: true
        timeout: 300

    - name: "Injecter l'IP dans la config du clone"
      ansible.builtin.uri:
        url: "https://{{ pve_api_host }}:8006/api2/json/nodes/nimbus14/qemu/10{{ vmid_proxy }}/config"
        method: POST
        headers:
          Authorization: "PVEAPIToken=root@pam!{{ pve_api_token_id }}={{ pve_api_token_secret }}"
        body_format: form-urlencoded
        body:
          ipconfig0: "ip=172.16.205.{{ vmid_proxy }}/16,gw=172.16.1.213"
        validate_certs: false
        status_code: 200

    - name: "[Proxy] Regénérer le disque Cloud-Init"
      ansible.builtin.uri:
        url: "https://{{ pve_api_host }}:8006/api2/json/nodes/nimbus14/qemu/10{{ vmid_proxy }}/cloudinit"
        method: PUT
        headers:
          Authorization: "PVEAPIToken=root@pam!{{ pve_api_token_id }}={{ pve_api_token_secret }}"
        validate_certs: false
        status_code: 200

    - name: "[Proxy] Démarrer la nouvelle VM"
      community.proxmox.proxmox_kvm:
        api_host: "{{ pve_api_host }}"
        api_user: "root@pam"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ pve_api_token_secret }}"
        node: "nimbus14"
        vmid: "10{{ vmid_proxy }}"
        validate_certs: false
        state: started
        timeout: 120

    - name: "Attendre que le port SSH soit dispo"
      ansible.builtin.wait_for:
        host: "172.16.205.{{ vmid_proxy }}"
        port: 22
        delay: 15
        timeout: 300
        state: started
